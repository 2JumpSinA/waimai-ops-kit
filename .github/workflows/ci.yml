name: ci

# 参考常见的 CI 最佳实践（test job + 守卫闸），按本仓库（Node 看板 + Python 广播）改写：
#   · 保留：CONCURRENCY、contents: read、fail-fast: false 的版本矩阵、
#     「检查后工作树必须干净」「不许把备份/产物带进仓库」两道小闸。
#   · 去掉：npm publish job（本仓库不是 npm 包，private: true）。
#     发布走 GitHub Release + tag，见文件末尾 release job。
#   · 新增：敏感内容守卫闸（tools/guard/scan.mjs）与 Python 语法检查。

on:
  push:
    branches: [main]
    # ⛔ 必须同时监听 tag：否则「只推 tag」不触发 workflow，release job 永远等不到。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# CI 只需要读代码；写权限只在 release job 单独给。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 闸门 0：敏感内容（真实店名 / 人名 / secret / cookie / 本机路径 / 手机号）──
  # 必须在 test 之前跑：内容不合规就没有「跑测试」的意义。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 扫描 git 索引里的文件；历史遗留命中在 tools/guard/baseline.json 里登记放行，
      # 本次新增命中一律失败。规则表：tools/guard/patterns.json
      - name: sensitive content guard
        run: node tools/guard/scan.mjs

      # 反例测试：守卫自己必须能拦住——植入一条假 secret 必须非零退出。
      # 注意：扫描对象是 **git 索引**，所以植入后要 `git add -f` 才进得来。
      # （没有这条，守卫「永远绿」也可能是规则写错了。）
      - name: guard self-test (must fail on a planted secret)
        run: |
          printf 'export const k = "ghp_0123456789abcdefghijABCDEFGHIJ012345";\n' > _guard_selftest.mjs
          git add -f _guard_selftest.mjs
          if node tools/guard/scan.mjs --strict >/dev/null 2>&1; then
            echo "::error::guard 没有拦住植入的假 secret —— 规则失效"; exit 1
          fi
          git rm -q --cached _guard_selftest.mjs && rm -f _guard_selftest.mjs
          echo "guard self-test ok"

      # 备份文件与构建产物不许入库（*.bak-* 是同步过来时就地备份的历史习惯）
      - name: no backup / build artifacts tracked
        run: |
          bad="$(git ls-files | grep -E '(\.bak|\.bak-|\.orig$|\.rej$)' || true)"
          if [ -n "$bad" ]; then echo "::error::备份文件被跟踪了："; echo "$bad"; exit 1; fi
          bad="$(git ls-files | grep -E '^(dashboard/dashboard\.html|dashboard/data/)' || true)"
          if [ -n "$bad" ]; then echo "::error::数据/产物被跟踪了："; echo "$bad"; exit 1; fi
          echo "artifacts guard ok"

  # ── Node 侧：看板单测（与 dashboard/package.json 的 engines ">=20" 对应）──
  test-node:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # ⛔ 刻意不跑 npm ci / npm install：
      #   看板源码零第三方 import（echarts 是 vendor 下的内联产物，build 时才读），
      #   仓库里不带 lockfile，加 npm ci 会直接失败。
      #
      # 哪些测试能在干净检出里跑，取决于两个「本机才有的东西」在不在：
      #   · _recon/struct/ref-post  → test:parity 的参考快照（不入库）
      #   · _recon/                 → test-atomic-runstate 的临时工作目录（不入库）
      # 我们有意识地**不假装通过**：跑不了的那几项显式打 notice 说明原因。
      - name: npm test (with graceful degradation)
        run: |
          # ⚠️ 注意 GitHub Actions 默认是 `bash -e`（遇错即停），
          # 而我们要「全跑完再汇总」，所以逐项显式收集失败，最后统一 exit。
          # 不用 `if ! cmd` 的写法：那会把命令放进条件上下文，某些 shell 下
          # 退出码语义容易出错（曾导致「测试全 PASS 却报 exit 1」）。
          FAILED=""

          run() {
            name="$1"; shift
            echo "─── $name ───"
            if "$@"; then
              echo "PASS $name"
            else
              echo "::error::$name 失败"
              FAILED="$FAILED $name"
            fi
          }

          # 无外部依赖的四个，必须过
          run "单测·窗口"     npm run test:window
          run "单测·装配"     npm run test:assemble
          run "单测·模型"     npm run test:model
          run "单测·播报指标" npm run test:mini

          # ⚠️ test:runner 验证的是「用文件 stdio 启动 powershell.exe」这条 Windows 专属路径
          #    （本机沙箱禁命名管道，所以生产实现走文件 stdio）。Linux runner 上没有
          #    powershell.exe，替身收不到参数、exitCode 恒为 null ⇒ 必然失败。
          #    这不是代码 bug，是平台依赖，所以**显式跳过并说明**，不假装通过。
          if [ "$RUNNER_OS" = "Windows" ]; then
            run "单测·刷新器" npm run test:runner
          else
            echo "::notice::test:runner 需要 powershell.exe（Windows 专属）→ 在 $RUNNER_OS 上跳过"
          fi

          # 依赖本机快照的两项：有就跑，没有就明说跳过（不假装通过）
          if [ -f _recon/struct/ref-post/src/template/dashboard.html ]; then
            run "parity·模板" npm run test:parity
          else
            echo "::notice::缺少 _recon/struct/ref-post 参考快照 → 跳过 test:parity（需本机逆向产物）"
          fi

          run "单测·原子状态" npm run test:atomic

          if [ -n "$FAILED" ]; then
            echo "::error::以下测试失败：$FAILED"
            exit 1
          fi
          echo "✅ 全部测试通过"

      # 抓「改了 src/ 却忘了提交」以及测试偷偷写盘
      - name: tree must be clean after the tests
        working-directory: .
        run: test -z "$(git status --porcelain)"

  # ── Windows 专属：test:runner（验证「文件 stdio 启动 powershell」这条本机生产路径）──
  # 为什么要单独一个 job：这套实现的核心动机是「本机沙箱禁命名管道，所以不能用
  # stdio:'pipe' 捕获输出，只能让子进程把日志写文件再尾巴读取」。Linux runner 上
  # 没有 powershell.exe，替身收不到参数 ⇒ 该测试只能在 Windows 上验证真伪。
  # 代价：CI 时间约翻倍（Windows runner 单价更高），换来这条最容易静默坏掉的
  # 进程管理路径有真机覆盖。
  test-node-windows:
    needs: guard
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dashboard
      shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm run test:runner (needs powershell.exe)
        run: npm run test:runner

      # runner 的测试会写 _recon/refresh-web.log —— 它被 .gitignore 忽略，
      # 但这里仍断言「没有改动被跟踪的文件」，防止测试偷偷改源码。
      - name: tree must be clean after the tests
        working-directory: .
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) { Write-Error "测试产生了未预期的改动:`n$dirty"; exit 1 }
          Write-Host "tree clean"

  # ── Python 侧：广播脚本语法检查（不装依赖、不联网）──
  test-python:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 只做语法/字节码编译：广播脚本依赖浏览器与内网 LLM，CI 里跑不起来也不该跑。
      # PYTHONPYCACHEPREFIX 让 .pyc 落到临时目录，不污染工作树。
      - name: python syntax check
        env:
          PYTHONPYCACHEPREFIX: /tmp/pyc
        run: |
          python -m compileall -q broadcast
          echo "python syntax ok"

      - name: tree must be clean after the check
        run: test -z "$(git status --porcelain)"

  # ── 发布：只在推 v* tag 时创建 GitHub Release；不发布到 npm ──────────────
  # 与纯 npm 包仓库的差别：那边需要 Trusted Publishing，这边是仓库里的
  # Node 脚本 + Python 脚本，没有可发布的包，所以产物 = GitHub Release 本身。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-node, test-node-windows, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 必需
    steps:
      - uses: actions/checkout@v4

      # 打包源码快照：双击可用的看板 HTML 由用户本地构建，这里只发源码。
      - name: pack source archive
        run: |
          git archive --format=tar.gz --prefix="waimai-ops-kit-${GITHUB_REF_NAME}/" \
            -o "waimai-ops-kit-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum "waimai-ops-kit-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "waimai-ops-kit-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
